[package]
name = "hnssh"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
httpdate = "1.0"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ring = "0.17"
russh = { version = "=0.62.6", default-features = false, features = ["ring"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Narrow protocol-reply fixes on the existing release; see vendor/russh/PATCHES.md.
[patch.crates-io]
russh = { path = "vendor/russh" }

[dev-dependencies]
rand = "0.10"
tempfile = "3.20"
vt100 = "0.16.2"
