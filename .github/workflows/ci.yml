name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: Format and lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite drives the real SSH transport, an emulated terminal screen,
      # fixture Hacker News endpoints, and 200 concurrent browsing sessions.
      - run: cargo test

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - checks
      - test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: hnssh-linux-x86_64
          path: target/release/hnssh
          if-no-files-found: error
          retention-days: 14

  production-topology:
    name: Production topology
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - release-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hnssh-linux-x86_64
          path: artifact
      - run: chmod +x artifact/hnssh deploy/validate-production-topology.sh
      - run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server netcat-openbsd
      - run: sudo env HNSSH_DISPOSABLE_VM=1 ./deploy/validate-production-topology.sh ./artifact/hnssh
